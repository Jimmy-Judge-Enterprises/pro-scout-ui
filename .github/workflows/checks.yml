name: Checks

# The canvas validates every record it emits against the vendored Gameplan
# contracts, so both halves of that promise are checked here: that the contracts
# are the ones they claim to be, and that the boundary rules built on them still
# hold. Bare node, no dependencies, matching how pro-scout runs its own checks.
#
# ORDER AND CONDITIONS ARE LOAD-BEARING.
#   The public-boundary check runs first and unconditionally, because this is the
#   repository that is actually public and it is the only step whose failure
#   means something has already been published. Every step after it carries
#   if: ${{ !cancelled() }} so that no step can suppress another.
#
#   Without that, one failing step skips every step below it, and a skipped step
#   reports NO RESULT -- indistinguishable from a pass unless you open the run
#   and read the step list, while the job goes red for the first failure and
#   looks fully explained. pro-scout had exactly this defect: on every red commit
#   its boundary check was skipped rather than run, for as long as main was
#   broken, and the red status is what hid it.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: No private Gameplan data in the public UI
        run: node scripts/check-public-boundary.mjs

      - name: The boundary check can fail
        if: ${{ !cancelled() }}
        run: node test/public-boundary.test.mjs

      - name: Vendored contracts are unmodified
        if: ${{ !cancelled() }}
        run: node scripts/verify-contracts.mjs

      - name: Boundary behaviour holds
        if: ${{ !cancelled() }}
        run: node test/contract.test.mjs

      - name: Search aliases point at real teams
        if: ${{ !cancelled() }}
        run: node test/team-aliases.test.mjs

      - name: Player table reads the manifest it is given
        if: ${{ !cancelled() }}
        run: node test/player-table.test.mjs

      - name: Team analysis derives and does not judge
        if: ${{ !cancelled() }}
        run: node test/team-analysis.test.mjs

      - name: Table sort handles absent values
        if: ${{ !cancelled() }}
        run: node test/table-sort.test.mjs

      - name: Prospect gauges are computed, never invented
        if: ${{ !cancelled() }}
        run: node test/anatomy-panel.test.mjs

      - name: Preview server stays inside its root
        if: ${{ !cancelled() }}
        run: node test/serve.test.mjs
